name: SLP InfoWare
description: SLP InfoWare was a French software company founded in 1989 by graduates of Telecom
  ParisTech and based in Paris, France, providing customer profiling, churn prediction, fraud
  detection, and retention analytics to the telecommunications, banking, and insurance industries.
  Its flagship products included CHURN MINER and a Churn/CPS application that analyzed customer
  billing data to predict and prevent subscriber attrition. The company raised venture funding and
  was acquired by Gemplus International SA in October 2000 (Gemplus later became part of Gemalto,
  now Thales). No independent SLP InfoWare website, developer portal, or public API surface exists
  today; this record is retained as a historical / portfolio-lineage entry in the API Evangelist
  network and carries no live API artifacts.
